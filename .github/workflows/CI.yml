name: Build modules
on: [push, workflow_dispatch]

jobs:
  build_prx:
    runs-on: ubuntu-latest
    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain
      GOLDHEN_SDK: ${{ github.workspace }}/SDK
    steps:
      - uses: actions/checkout@v4

      - name: Instalar clang, lld y llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          which llvm-ar || sudo ln -s "$(ls /usr/bin/llvm-ar-* | head -1)" /usr/bin/llvm-ar

      - name: Descargar OpenOrbis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          cd /tmp/dl
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz'
          tar xzf *.tar.gz -C $GITHUB_WORKSPACE
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/*

      - name: Descargar y compilar GoldHEN SDK
        run: |
          rm -rf $GOLDHEN_SDK
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git $GOLDHEN_SDK
          make -C $GOLDHEN_SDK PRINTF=1 DEBUGFLAGS=1

      - name: Escribir main.c
        run: |
          mkdir -p $GITHUB_WORKSPACE/menu
          cat > $GITHUB_WORKSPACE/menu/main.c <<'EOF'
          #include <stdint.h>
          #include <stddef.h>

          #ifndef attr_public
          #define attr_public __attribute__((visibility("default")))
          #endif

          #define BTN_UP     0x00000010U
          #define BTN_DOWN   0x00000040U
          #define BTN_R1     0x00000800U
          #define BTN_CROSS  0x00004000U
          #define BTN_CIRCLE 0x00002000U
          #define BTN_SQUARE 0x00008000U

          typedef void *pthread_handle_t;

          int scePthreadCreate(pthread_handle_t *thread, const void *attr, void *(*entry)(void *), void *arg, const char *name);
          int sceKernelUsleep(unsigned int usec);
          int sceKernelSendNotificationRequest(int device, void *req, size_t size, int blocking);
          int sceKernelOpen(const char *path, int flags, int mode);
          long sceKernelWrite(int fd, const void *buf, size_t n);
          int sceKernelClose(int fd);
          int scePadInit(void);
          int scePadOpen(int userId, int type, int index, const void *param);
          int scePadGetHandle(int userId, int type, int index);
          int scePadReadState(int handle, void *data);
          int sceUserServiceGetInitialUser(int *userId);

          typedef struct {
              char unk[45];
              char msg[3075];
          } notify_request_t;

          static notify_request_t g_req;
          static uint8_t g_pad[512] __attribute__((aligned(16)));

          #define NOPT 3
          static const char *g_names[NOPT] = { "Opcion 1", "Opcion 2", "Opcion 3" };
          static int g_state[NOPT] = { 0, 0, 0 };
          static int g_sel = 0;
          static int g_open = 0;
          static volatile int g_started = 0;
          static pthread_handle_t g_thread;

          static void logs(const char *s) {
              int fd = sceKernelOpen("/data/FortniteMenu.log", 0x209, 0777);
              if (fd < 0) return;
              int n = 0;
              while (s[n]) n++;
              sceKernelWrite(fd, s, n);
              sceKernelWrite(fd, "\n", 1);
              sceKernelClose(fd);
          }

          static void logn(const char *label, int v) {
              char buf[96];
              int n = 0;
              while (label[n] && n < 70) { buf[n] = label[n]; n++; }
              if (v < 0) { buf[n++] = '-'; v = -v; }
              char tmp[16];
              int t = 0;
              if (v == 0) tmp[t++] = '0';
              while (v > 0 && t < 15) { tmp[t++] = '0' + (v % 10); v /= 10; }
              while (t > 0) buf[n++] = tmp[--t];
              buf[n] = 0;
              logs(buf);
          }

          static void put(char *dst, int *n, const char *s) {
              while (*s && *n < 3000) {
                  dst[*n] = *s;
                  (*n)++;
                  s++;
              }
              dst[*n] = 0;
          }

          static void notify(const char *text) {
              int i = 0;
              while (text[i] && i < 3070) {
                  g_req.msg[i] = text[i];
                  i++;
              }
              g_req.msg[i] = 0;
              int r = sceKernelSendNotificationRequest(0, &g_req, sizeof(g_req), 0);
              logn("notify ret=", r);
          }

          static void show_menu(void) {
              char buf[400];
              int n = 0;
              buf[0] = 0;
              put(buf, &n, "MENU FORTNITE\n");
              for (int i = 0; i < NOPT; i++) {
                  put(buf, &n, (i == g_sel) ? "> " : "  ");
                  put(buf, &n, g_names[i]);
                  put(buf, &n, g_state[i] ? ": ON\n" : ": OFF\n");
              }
              put(buf, &n, "X = cambiar | O = cerrar");
              notify(buf);
          }

          static void *menu_thread(void *arg) {
              (void)arg;
              int userId = 0;
              int handle = -1;
              int tries = 0;
              uint32_t prev = 0;

              logs("hilo: iniciado");
              sceKernelUsleep(5000000);
              int ru = sceUserServiceGetInitialUser(&userId);
              logn("hilo: GetInitialUser ret=", ru);
              logn("hilo: userId=", userId);
              int ri = scePadInit();
              logn("hilo: scePadInit ret=", ri);

              while (handle < 0 && tries < 60) {
                  handle = scePadGetHandle(userId, 0, 0);
                  if (tries < 3) logn("hilo: GetHandle=", handle);
                  if (handle < 0) {
                      handle = scePadOpen(userId, 0, 0, 0);
                      if (tries < 3) logn("hilo: Open=", handle);
                  }
                  if (handle < 0) {
                      tries++;
                      sceKernelUsleep(2000000);
                  }
              }
              if (handle < 0) {
                  logs("hilo: no pude abrir el control");
                  notify("Menu: no pude leer el control");
                  return (void *)0;
              }

              logn("hilo: control OK handle=", handle);
              notify("Menu listo: R1 + Cuadrado");

              for (;;) {
                  if (scePadReadState(handle, g_pad) == 0) {
                      uint32_t b = *(uint32_t *)g_pad;
                      uint32_t pressed = b & ~prev;
                      uint32_t combo = BTN_R1 | BTN_SQUARE;

                      if ((b & combo) == combo && (pressed & combo)) {
                          g_open = !g_open;
                          logn("combo detectado, abierto=", g_open);
                          if (g_open) show_menu();
                          else notify("Menu cerrado");
                      } else if (g_open) {
                          if (pressed & BTN_UP) {
                              g_sel = (g_sel + NOPT - 1) % NOPT;
                              show_menu();
                          } else if (pressed & BTN_DOWN) {
                              g_sel = (g_sel + 1) % NOPT;
                              show_menu();
                          } else if (pressed & BTN_CROSS) {
                              g_state[g_sel] = !g_state[g_sel];
                              show_menu();
                          } else if (pressed & BTN_CIRCLE) {
                              g_open = 0;
                              notify("Menu cerrado");
                          }
                      }
                      prev = b;
                  }
                  sceKernelUsleep(16000);
              }
              return (void *)0;
          }

          static void start_once(const char *who) {
              logs(who);
              if (!g_started) {
                  g_started = 1;
                  notify("FortniteMenu cargado");
                  int r = scePthreadCreate(&g_thread, 0, menu_thread, 0, "FortniteMenu");
                  logn("scePthreadCreate ret=", r);
              }
          }

          attr_public const char *g_pluginName = "FortniteMenu";
          attr_public const char *g_pluginDesc = "Menu R1 + Cuadrado";
          attr_public const char *g_pluginAuth = "FortniteMenu";
          attr_public uint32_t g_pluginVersion = 0x00000100;

          attr_public int32_t plugin_load(int32_t argc, const char *argv[]) {
              start_once("plugin_load llamado");
              return 0;
          }

          attr_public int32_t plugin_unload(int32_t argc, const char *argv[]) {
              logs("plugin_unload llamado");
              return 0;
          }

          attr_public int32_t module_start(size_t argc, const void *args) {
              start_once("module_start llamado");
              return 0;
          }

          attr_public int32_t module_stop(size_t argc, const void *args) {
              logs("module_stop llamado");
              return 0;
          }
          EOF

      - name: Compilar plugin
        run: |
          cd $GITHUB_WORKSPACE/menu

          clang -D__FINAL__=1 --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c \
            -D__USE_PRINTF__ -Wall \
            -isysroot $OO_PS4_TOOLCHAIN -isystem $OO_PS4_TOOLCHAIN/include -I$GOLDHEN_SDK/include \
            -o main.o main.c

          ld.lld $GOLDHEN_SDK/build/crtprx.o main.o -o FortniteMenu.elf \
            -m elf_x86_64 -pie --script $OO_PS4_TOOLCHAIN/link.x -e _init --eh-frame-hdr \
            -L$OO_PS4_TOOLCHAIN/lib -L$GOLDHEN_SDK \
            -lSceLibcInternal -lGoldHEN_Hook -lkernel -lSceSysmodule -lScePad -lSceUserService

          $OO_PS4_TOOLCHAIN/bin/linux/create-fself -in=FortniteMenu.elf -out=FortniteMenu.oelf \
            --lib=FortniteMenu.prx --paid 0x3800000000000011

          ls -la

      - name: Subir PRX
        uses: actions/upload-artifact@v4
        with:
          name: FortniteMenu
          path: menu/FortniteMenu.prx
