name: Build modules
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build_prx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar clang, lld y llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          which llvm-ar || sudo ln -s "$(ls /usr/bin/llvm-ar-* | head -1)" /usr/bin/llvm-ar

      - name: Descargar OpenOrbis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          cd /tmp/dl
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz'
          tar xzf *.tar.gz -C $GITHUB_WORKSPACE

      - name: Descargar GoldHEN SDK
        run: |
          rm -rf $GITHUB_WORKSPACE/SDK
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git $GITHUB_WORKSPACE/SDK

      - name: Dejar solo plugin_template
        run: |
          cd plugin_src
          for d in */; do
            if [ "$d" != "plugin_template/" ]; then rm -rf "$d"; fi
          done
          ls

      - name: Escribir main.c
        run: |
          cat > plugin_src/plugin_template/source/main.c <<'EOF'
          #include <stdint.h>
          #include <stddef.h>

          #ifndef attr_public
          #define attr_public __attribute__((visibility("default")))
          #endif

          typedef struct {
              char unk[45];
              char msg[3075];
          } notify_request_t;

          int sceKernelSendNotificationRequest(int device, notify_request_t *req, size_t size, int blocking);

          static notify_request_t g_req;

          static void notify(const char *text) {
              int i = 0;
              while (text[i] && i < 3070) {
                  g_req.msg[i] = text[i];
                  i++;
              }
              g_req.msg[i] = 0;
              sceKernelSendNotificationRequest(0, &g_req, sizeof(g_req), 0);
          }

          attr_public const char *g_pluginName = "FortniteMenu";
          attr_public const char *g_pluginDesc = "Menu de prueba";
          attr_public const char *g_pluginAuth = "FortniteMenu";
          attr_public uint32_t g_pluginVersion = 0x00000100;

          attr_public int32_t plugin_load(int32_t argc, const char *argv[]) {
              notify("FortniteMenu cargado");
              return 0;
          }

          attr_public int32_t plugin_unload(int32_t argc, const char *argv[]) {
              return 0;
          }

          attr_public int32_t module_start(size_t argc, const void *args) {
              notify("FortniteMenu cargado");
              return 0;
          }

          attr_public int32_t module_stop(size_t argc, const void *args) {
              return 0;
          }
          EOF

      - name: Compilar
        run: |
          export OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain
          export GOLDHEN_SDK=$GITHUB_WORKSPACE/SDK
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/create-fself
          make

      - name: Preparar archivos finales
        run: |
          mkdir -p out
          cp bin/plugins/prx_final/plugin_template.prx out/FortniteMenu.prx
          printf '[default]\n/data/GoldHEN/plugins/FortniteMenu.prx\n' > out/plugins.ini
          ls -la out
          cat out/plugins.ini

      - name: Publicar Release con los archivos sueltos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FortniteMenu build ${{ github.run_number }}
          files: |
            out/FortniteMenu.prx
            out/plugins.ini
