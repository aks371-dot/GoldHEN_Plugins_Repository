name: Leer SDK
on: [push, workflow_dispatch]

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar SDK de GoldHEN
        run: git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git sdk

      - name: Descargar OpenOrbis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          cd /tmp/dl
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz'
          tar xzf *.tar.gz

      - name: Imprimir lo que necesito ver
        run: |
          echo "=== fliprate_remover main.c ==="
          cat plugin_src/fliprate_remover/source/main.c
          echo "=== headers del SDK ==="
          ls sdk/include
          echo "=== GoldHEN.h (hooks) ==="
          grep -n -i -E "hook|detour|dlsym" sdk/include/GoldHEN.h | head -60
          echo "=== VideoOut.h ==="
          VO=$(find /tmp/dl -name VideoOut.h | head -1)
          echo "$VO"
          grep -n -i -E "BufferAttribute|pixelFormat|tilingMode|RegisterBuffers|SubmitFlip|width|height|pitch" "$VO" | head -60
